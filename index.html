:root{--green:#18453B;--cream:#F5F0E6;--sage:#DCE6DC;--ink:#333B36;--muted:#657168;--line:#D9DDD2}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:18px}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh}header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:22px max(24px,calc((100vw - 1040px)/2));border-bottom:1px solid #18453B1c}header a{color:var(--green);text-decoration:none;font-weight:bold;cursor:pointer}.header-right{display:flex;align-items:center;gap:22px}.accessibility-toggle{background:transparent;border:1px solid #8ba597;color:var(--green);border-radius:6px;padding:9px 12px;min-height:44px;cursor:pointer;font:600 13px Arial,sans-serif}.accessibility-toggle:hover{background:#e5ede4}.accessibility-panel{position:absolute;right:max(24px,calc((100vw - 1040px)/2));top:calc(100% - 5px);width:min(350px,calc(100vw - 40px));background:#fffdf8;border:1px solid #9baea1;border-radius:8px;padding:18px 20px;box-shadow:0 12px 28px #18453b25;z-index:10;font:14px/1.65 Arial,sans-serif;color:#334c3c}.accessibility-panel h2{font:700 16px/1.3 Arial,sans-serif;margin:0 0 8px}.accessibility-panel p{margin:0}.accessibility-panel[hidden]{display:none}.brand{font:700 12px/1.4 Arial,sans-serif;letter-spacing:.15em}.back{font:13px Arial,sans-serif}main{position:relative;isolation:isolate;max-width:1040px;margin:auto;padding:62px 24px 100px;min-height:68vh}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--green)}h1{color:var(--green);font-size:clamp(38px,4.95vw,58px);line-height:1.07;margin:15px 0 20px;letter-spacing:-.035em}h2{color:var(--green);font-size:clamp(36px,5vw,58px);margin:14px 0 20px;letter-spacing:-.025em}.intro{max-width:600px;font-size:18px;line-height:1.75;color:#59675e}.hero{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:35px;align-items:center;min-height:260px}.portrait-wrap{position:relative;justify-self:center;padding:16px}.portrait-wrap:before{content:'';position:absolute;inset:4px 0 25px 26px;background:var(--sage);border-radius:50%;transform:rotate(-14deg)}.portrait{position:relative;width:185px;height:185px;border-radius:50%;object-fit:cover;object-position:center 36%;border:6px solid var(--cream);box-shadow:0 9px 24px #18453b1c}.explore-label{margin-top:42px;font:700 11px Arial,sans-serif;letter-spacing:.2em;color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:16px}.card{position:relative;overflow:hidden;min-height:195px;background:#fffdf8;border:1px solid var(--line);border-radius:9px;text-align:left;padding:27px;cursor:pointer;transition:transform .2s,box-shadow .2s;color:var(--ink)}.card:before{content:'';position:absolute;right:0;top:0;width:70px;height:55px;background:var(--sage);clip-path:polygon(100% 0,100% 100%,0 0)}.card:nth-child(2):before{background:#e5eadd;clip-path:polygon(100% 0,100% 100%,0 100%)}.card:nth-child(3):before{background:#e6e0ce;clip-path:polygon(100% 0,100% 100%,30% 0)}.card:hover,.question:hover{transform:translateY(-4px);box-shadow:0 14px 32px #18453b17}.card h3{font-size:25px;color:var(--green);margin:12px 0 10px}.card p{font:14px/1.6 Arial,sans-serif;color:var(--muted)}.card .arrow{color:var(--green);font:13px Arial,sans-serif;font-weight:bold}.geom{position:fixed;z-index:-1;pointer-events:none;opacity:.95}.geom-top{width:230px;height:115px;background:var(--green);clip-path:polygon(0 0,100% 0,0 100%);top:0;left:0}.geom-bottom{width:180px;height:105px;background:var(--green);clip-path:polygon(100% 0,100% 100%,0 100%);bottom:0;right:0}.geom-line{position:absolute;z-index:-1;right:2%;top:50px;width:110px;height:110px;border-top:2px solid #18453B65;transform:rotate(-19deg)}.section-intro{max-width:750px}.questions{display:grid;gap:14px;max-width:820px;margin-top:40px}.question{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:24px;text-align:left;border:1px solid var(--line);background:#fffdf8;border-radius:7px;color:var(--ink);cursor:pointer;font:19px/1.4 Georgia,serif;transition:.2s}.question span:last-child{color:var(--green);font:24px Arial,sans-serif}.modal-layer{position:fixed;inset:0;background:#142e28b8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{position:relative;background:var(--cream);width:min(650px,100%);max-height:85vh;overflow:auto;padding:clamp(26px,5vw,55px);border-radius:9px;box-shadow:0 30px 70px #0004;border-top:6px solid var(--green)}.modal h2{font-size:30px;line-height:1.25;margin:15px 0 25px}.modal p{font:17px/1.8 Georgia,serif}.answer-text p{margin:0 0 1.15em}.answer-text p:last-child{margin-bottom:0}.answer-text p.followup{margin-top:1.8em;padding:12px 16px;border-left:3px solid #9aad9c;background:#e9eee5;color:#536b5c;font-style:italic;font-size:16px}.answer-text p.speaker{margin-top:1em;color:var(--green)}.close{position:absolute;top:14px;right:18px;background:none;border:0;font-size:30px;cursor:pointer;color:var(--green)}.interview-byline{font:16px/1.5 Arial,sans-serif;color:var(--muted);margin:-4px 0 18px}.faculty-identity{margin-top:22px;max-width:610px}.faculty-name{font:600 24px/1.4 Georgia,serif;color:var(--green);margin:0 0 9px}.faculty-role{font:14px/1.6 Arial,sans-serif;color:var(--muted);margin:3px 0}.closing-response{margin:32px auto 0;padding:26px 20px 22px;max-width:670px;text-align:center;border-top:1px solid var(--line)}.closing-question{font:italic clamp(22px,2.7vw,27px)/1.4 Georgia,serif;color:var(--muted);margin:0 0 12px}.closing-answer{font:clamp(25px,3.3vw,34px)/1.25 Georgia,serif;color:var(--green);margin:0;white-space:nowrap}.closing-answer strong{font-size:1.22em;font-weight:700}footer{position:relative;font:12px Arial,sans-serif;color:#7b847e;text-align:center;padding:30px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #135f4e;outline-offset:4px}button{font-family:inherit} .skip-link{position:absolute;left:16px;top:-100px;background:#fff;color:#18453B;padding:12px 18px;z-index:30;font:700 15px Arial,sans-serif;border:2px solid #18453B}.skip-link:focus{top:12px}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.card,.question{touch-action:manipulation}.card p,.intro,.faculty-role{color:#4c5c51}.answer-text p.followup{color:#334c3c;background:#e1e9df}.modal{overscroll-behavior:contain}.modal-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 23px}.listen-button{background:#18453B;color:#fff;border:2px solid #18453B;border-radius:7px;padding:11px 16px;font:700 14px Arial,sans-serif;cursor:pointer;min-height:44px}.listen-button:hover{background:#25624f}.listen-button[disabled]{opacity:.55;cursor:not-allowed}.speech-speed{display:flex;align-items:center;gap:8px;font:14px Arial,sans-serif;color:#34493b}.speech-speed select{min-height:44px;padding:6px;border:1px solid #657168;border-radius:5px;background:#fff;color:#233b30;font:inherit}.speech-status{font:13px Arial,sans-serif;color:#34493b;min-height:1em}.close{min-width:44px;min-height:44px;display:grid;place-items:center;top:9px;right:10px}.question span:last-child{flex-shrink:0}.modal-layer{overscroll-behavior:contain}@media(forced-colors:active){.card,.question,.listen-button{border:2px solid ButtonText}.geom{display:none}}@media(max-width:700px){header{padding:19px 22px}main{padding:48px 24px 90px}.hero{grid-template-columns:1fr;gap:8px}.portrait-wrap{grid-row:1;justify-self:start;margin-left:5px}.portrait{width:128px;height:128px}.explore-label{margin-top:35px}.cards{grid-template-columns:1fr}.card{min-height:170px}.card h3{margin-top:12px}.closing-answer{font-size:clamp(19px,5vw,28px)}.geom-top{width:110px;height:65px}.geom-bottom{width:95px;height:60px}.geom-line{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!importa </style></head><body><a class="skip-link" href="#app">Skip to main content</a><div class="geom geom-top" aria-hidden="true"></div><div class="geom geom-bottom" aria-hidden="true"></div><header><a href="#/" class="brand">MSU · CCE | INTERVIEW</a><div class="header-right"><button type="button" id="accessibilityToggle" class="accessibility-toggle" aria-expanded="false" aria-controls="accessibilityPanel">Accessibility</button><a class="back" href="#/" id="homeLink">Home</a></div><section id="accessibilityPanel" class="accessibility-panel" aria-labelledby="accessibilityHeading" hidden><h2 id="accessibilityHeading">Accessibility features</h2><p>Keyboard navigation · Screen reader support · Adjustable text-to-speech playback · Reduced motion preferences.</p></section></header><main id="app" tabindex="-1"></main><div id="overlay"></div><script>
const sections=[{"id": "leader", "title": "As a Leader", "icon": "✦", "desc": "What · How · For Whom", "intro": "What · How · For Whom", "questions": [{"q": "Your leadership roles have changed this year. Could you tell us about that?", "a": ["Sure. It has been a privilege to direct the PhD program in Counselor Education and Supervision, as well as the two master's programs in Rehabilitation Counseling and Clinical Mental Health Counseling. With new faculty coming on board, namely Dr. Phillip Rumrill, we're really seeing the need for new blood and new ideas, so we can divide and conquer in a growing program. When I say growing, I mean growing in numbers, but also growing in intensity. Rather than being localized in Michigan, a lot of our initiatives, whether in training or research, go well beyond Michigan, to different states and internationally.", "So Dr. Rumrill will oversee the two master's programs, and I remain the program director for the PhD program. But Dr. Rumrill and I will keep the designation of co-directors of our program area. Part of the reason is that we want the three programs to come across as one program, not three separate programs standing on their own but a bigger family. Some of the things we're doing with student mentoring and student representatives are ideas we hope will move us in that direction, and having more minds to brainstorm actually helps with that.", "Having said that, I don't know if students feel it, but it's still pretty much everybody doing and helping with everything. It's really just a designation, so that when certain things need someone to lead them, there is a clear person. For example, it's admission season, so one person needs to start looking at applications and then ask others to assist in different ways. The titles have changed, but we still work as a group.", "I'm excited about it, because a change in leadership also gives us a chance to reflect on what has worked well and what could be improved. We're treating this year as a transition period, where we will meet, brainstorm, and make decisions together, and eventually we will try to be clearer about the specific tasks."]}, {"q": "How do you see your role as PhD program director and master’s program co-director?", "a": ["In general, I see the director's role as helping to create the right conditions and environment for students and faculty to excel and do their best work. That involves communication, thoughtful planning and coordination, and being attentive to students' needs, but also to the needs of the larger field, because those needs are changing. It's not just about the students themselves, but about preparing them to face the world. Whatever is changing in society, we need to be aware of it. I like to believe I operate the same way in both the master's and the PhD programs.", "Identity is especially important with the ongoing changes around rehabilitation identity. When people question what rehabilitation counseling and counselor education are, I feel very proud to say that we are able to tell students that each one of us has an identity, and there is something in our background that we are all good at. I would love to see rehabilitation counselors and educators as chameleons, able to change and adapt really nicely. I have told students that when I see each of them, I see their strengths and their expertise.", "What is important is having that foundation, so that when they go out and interact with other disciplines, they don't question who they are. They know this is their strength, this is what they can bring, and they can collaborate with others so that their expertise in disability, rehabilitation, and education stands out. It's not that we are lower or below; we are on the same playing field, and we have something to offer. That is what I find a director can influence, for both master's and PhD students."]}, {"q": "You serve in different roles across the programs. How do those roles differ for you?", "a": ["For the master's programs, we focus more on helping students develop their clinical skills, because they will be working on the front line as counselors. Many students come in with a non-psychology or non-human-services background, so it's also important to make sure they understand their identity as rehabilitation counselors and where they can go in terms of practice. There are many opportunities, not just the traditional route of vocational rehabilitation, but also independent living, school transition, and the criminal justice area. So the main thing for master's students is making sure they have a strong foundation and are clinically skilled, so that they can take on the world, so to speak.", "For the PhD, the focus is a little more on research and the training of counselors. PhD students typically already know their identity coming in, so it's more about reinforcing it and sharpening their research and leadership skills. We are preparing them to be leaders at a different level, where they may need to be more outspoken and assert their expertise. So the differences would probably be research, advocacy for system-level change, and being a devoted educator.", "But you know what? It's not just me. It takes all the faculty members and advisors to help with individual students. As you know, I am not meeting with all 52 students in the program; I only do that with my own lab folks. So another part of being a director is making sure to work well with faculty, because they are colleagues who work side by side with you and help build the program. I always think that a program with one person is not a program. A program with excellent faculty and great students is what makes it well known to others. So it's all about you, too, being part of it."]}, {"q": "What do you strive for as a leader?", "a": ["I think there are many different great ways to be a leader, and it's important that the style fits my personality. People often describe me as very approachable, so I want to capitalize on that. But there's a caveat: as a leader, I need to be approachable, fair, and consistent.", "Faculty, students, and the community need to feel comfortable raising a concern. \"Complain\" is not a bad word. If something is not going well, they need to feel comfortable saying, \"Hey, this is not working. Could we look at it from a different perspective?\" A leader is not a dictator. I really want to be the kind of leader to whom you can raise a concern, and I want to listen. But being approachable alone is not enough.", "Being fair is also important. If I favored one student over another, that would not be objective, and that is not what a leader should be. A leader should be able to say, \"Even though you're my student, this is not looking good, and I won't pass your comps. Maybe you need to redo it.\" Or, \"You are not my student, but you need this help and this support, so we need to advocate for you just as we would for my own student.\" I try my best to do the right thing, so that I always have a reasonable and convincing justification for why I do things the way I do.", "The other thing is that I am very much a group person. I really believe a leader is somebody who walks alongside, or even a little behind, the group, so that they can shine. It's not about me leading myself; it's about leading others so that we can all be recognized as a group. Even with my research, I tell my students, \"I'm not asking you to do all the work so I can say it's my work. I want to do it together with you, so that we can all learn from each other.\" Those are the philosophies of leadership that I firmly believe in.", "Well, that means I get to do more work, right? I can't just sit here doing nothing.", "Another thing about being a leader, and it's the same with mentoring. What I find increasingly true is that being older, with some experience, helps you see the bigger picture. Students sometimes don't see their own strengths. So when you see potential in students and you see an opportunity, it's important to cultivate it so they can develop. I think that is part of being a leader or an educator: you help people grow, to the point that they become independent and really confident in what they do, and then they can pay it forward and do the same for others.", "But students often work so hard and don't realize it. It's not just about me pushing them. When I push them, they are receptive and they want to develop. So when they are successful, the majority of it is their work. They worked hard for it."]}, {"q": "What do you hope students will take away from the program?", "a": ["For master's students, I want them to leave the program with confidence in their clinical judgment and in their skills as counselors, but also with humility about what they need to keep learning.", "For PhD students, it's similar. I want them to become confident in their skills as educators and as independent researchers, and to keep challenging themselves by elevating their research collaborations. I have found that in my own career: I started off with some research and some collaboration, and it has never stopped. Now I collaborate with other colleagues and other disciplines.", "I also want them to take away that they should be proud Spartan graduates. And our doors are always open to all alums when they go on to succeed. They are always part of the family, and that's really important."]}]}, {"id": "professor", "title": "As a Professor", "icon": "✧", "desc": "LIFE Lab · Mentorship", "intro": "LIFE Lab · Mentorship", "questions": [{"q": "What is the LIFE Lab, and how has it evolved?", "a": ["I love my lab. I see the lab as a research opportunity to develop the work I am passionate about, which is psychosocial adjustment for family caregivers and for individuals with chronic and persistent health conditions or developmental disabilities. I have some unique projects that are active, which I'll mention a little later, but overarching all of that, I really wanted a platform where like minds could work together.", "It really started when I first came to MSU in 2014. I started the lab with four colleagues, and then, as I had more doctoral students, they joined too. Because I was new, I really wanted to develop a project that looks at family transition for people with neurodevelopmental disabilities. We began with focus groups to ask stakeholders about their transition needs, and then developed from there any interventions or strategies that could help them. So LIFE Lab version 1 was a small group, all within MSU, meeting in person every month to talk about that one project.", "Now we have version 2. Over the course of ten years, we have had successful doctoral students graduate and become independent faculty, researchers, and educators, so we can't all meet in person anymore, and we meet online. Also, as more projects developed, it was no longer possible to spend a monthly meeting on one project. So now we use it for quick reports on the progress of each project, but also as a space where lab members can bring specific questions or problems in their research to the group.", "So in version 2, I wanted to make it more explicit that this is also a research training lab. We are very fortunate that we now have 20 members. We have master's students, undergraduate students, doctoral students from other universities, like the University of Iowa and Florida International University, and visiting scholars who came for a year to collaborate and now sometimes join from their home countries when time allows. That's why, in our revision of the lab's Facebook page and website, we have a section that honors our alumni. Some of them may not be meeting every month, but they are involved in other aspects, and they are still part of it.", "Basically, it's like an expanding family, and that's exciting. We call it LIFE, and since the focus is on family, I like to play on the word: this is the LIFE Lab family. The family is growing; members get married and have their own families, right? So now they can bring the grandchildren back to visit and all that. I like that analogy.", "Interviewer: You make the LIFE Lab feel like a family.", "Thank you. Well, we have good kids, right?"]}, {"q": "How do you support students with different research interests?", "a": ["Mentoring students at different levels—undergraduate, master's, and doctoral—is important to me. I think it comes with seeing the strengths of different students, because I maintain that all lab members have a role; it's just that the roles are different. Often an undergraduate will say, \"I have no experience. Can I actually come to the lab?\" And I say, \"Tell me your strengths,\" because there is always something they can help with. At the very least, they can observe and see what interests them, and then say, \"Oh, I can help in these ways.\" Research is never a one-person job, so it's important that we rely on each other in a positive way. I really want to be there together with everybody, so that we can enjoy it together, or if there's stress, we can stress together.", "When students have different interests, I honor that. As researchers, we always have a broad research interest that we keep refining. For example, I would say the psychosocial aspects of disability and family are my area, but if I go into more detail, I can talk about the different projects and how they fit into this broader theme. This is also how I would like doctoral students to write their statements when they are ready to apply for jobs: look at the broad picture, then fill in the details. Over time, the details and the picture become more refined as you learn more and encounter new ideas. And as a more seasoned researcher, it's also important to be able to apply your skill set to slightly different projects. So I think it is important to have autonomy within each student's research interests."]}, {"q": "How do you organize collaboration within the lab?", "a": ["Interviewer: Dr. Kuo mentioned using an AI assistant. Do you use AI or an assistant to help manage your projects?", "No. I would like to believe I'm the AI for now; maybe I can find one. Let me put it this way: the downside is that I want to do everything myself, which sometimes isn't possible. So I have to realize that I am not good at certain things, for example social media. We're revamping our Facebook page, and we have lab members who are better at navigating that, so I rely on them. Otherwise, when we meet, I like to take notes. I should learn to use AI, but I still like typing notes, documenting what we need to work on. So I guess I don't have an assistant, but I see everybody helping in different roles.", "A good example is our third ongoing project, on college students with different disabilities and their well-being. In the spring semester, the whole lab used our meeting time to think about the research interests of individual members and to come up with something that, as much as possible, would let everyone say, \"Yes, I can see my area in there.\"", "We started from the broader aspect of psychosocial adjustment. Focusing on family would have been a little more restrictive, so we opened it up to college students, because that was really the collective idea. Many of the doctoral students are interested in emotion regulation, so we wanted to look at emotional coping as something that affects students' well-being and academic performance. Some lab members are very passionate about disability identity, so we added an element on how identity could affect students with disabilities.", "This is where we negotiated as a group. Some members are very passionate about physical disability, and some are more focused on mental health disabilities. So we talked, also informed by the literature, about how different disabilities may have a different impact on identity, because some disabilities can be hidden while others are more visible. So we now have a research question about how disability identity may affect different disability groups. We also have lab members who are interested in trauma, so we added an element on how trauma may affect emotionality, which may in turn affect students' performance in life and in academics.", "I'm really proud to say that this third project came collectively from everybody. You can see that this angle reflects one student's interest, that one reflects another's. You can see aspects that each person finds interesting.", "And it doesn't stop at data collection. Some students may be really good at data cleaning, so they help clean the data. Some may be better at writing or reviewing the literature. There is a lot we can divide up as a group, depending on each person's strengths and what kind of experience they want. And in the end, the conference presentations, publications, and so on all come out of the group together. That is our intention.", "Interviewer: Does everyone work on the same project, or are there smaller teams too?", "For that particular one, yes, but we also have smaller ones, too. Sometimes I have a project that needs the final touches: updating the literature and finishing the discussion of a qualitative study. If I see lab members who are very good at identifying literature and doing qualitative work, I would like them to have the opportunity to contribute. And often, and I'm really honored by this, students like to participate in some of the things I do.", "In version 1, the great product was the different publications from the focus groups. We also developed an intervention, the family psychoeducation transition intervention. With version 2, we anticipate more great products coming out, thanks to the good work of everybody currently in the lab."]}, {"q": "What projects are students currently working on?", "a": ["Another project is the FITI+ family transition program. We have the IRB approval, and we will be launching it as an online program. It's great that we have an undergraduate who recently joined and has resources for recruitment. That's another example of someone who has her own strengths and can help move the project forward.", "We're hoping to launch it not just as an online family psychoeducation group, but, if at all possible, to engage young adults with disabilities as well, so that we can run another group to help them. Ultimately, we would like to see whether it's not just caregivers doing better because they have support from the content, but also young adults doing better because their caregivers have the knowledge to help them. Our first publication from version 1 showed that caregivers benefited a lot. They also saw their young adults being more active and engaged in transition-related activities. Not in terms of outcomes like job placement; we understand that with ten weeks of psychoeducation, we cannot make placement happen. But at least the young adults are working toward goals that are meaningful for them.", "We will be training lab members who are interested in helping to run those groups. We hope to run them by the end of this semester or next semester, so we can collect more data and understand whether the program is working well. I would also love to tap into colleagues like Dr. Kuo, who knows AI, to see how we can use AI to make the psychoeducation more interactive and more user-friendly. That is one thing we would like to do in the next year.", "The other project is SIERA, the emotion regulation program. I would not claim to be the lead on that one, because the lead is Dr. Heekyung Lee, who is now a member of our lab as well. It was her dissertation. We have had really great success replicating it in different communities and different countries. In fact, Dr. Heekyung Lee emailed me literally five minutes ago to say that one of the publications from the adaptation just got accepted. So that's really great, and all this great news comes from everybody working really hard. With SIERA, we also have a few lab members helping to run it with Peckham.", "So together with the college student study, those are the three main projects, and then there are smaller things we can help each other with. Plus, doctoral students have their dissertations. I also want to make sure that undergraduate and master's students who may not be drawn to my three projects, but like what other doctoral students are doing, are welcome to work with those doctoral students. The idea is that training is not just about doing my work; it's about helping each other do the work, so that everyone gains experience and we can keep sailing the ship, so to speak."]}, {"q": "How can students get involved in the LIFE Lab?", "a": ["That's an easy question. All they need to do is email me and say they're interested, and then we can talk about what would be possible and how involved they would like to be. I want to respect that we all have different priorities. You may need to focus on your internship, on studying for the CRC exam, or on your own apprenticeship, and you will also be working with your advisor. But the lab is here so that, if you're interested, you can focus on one paper or help with one thing, or it can be something more elaborate. We're also updating this information on the website."]}]}, {"id": "fun", "title": "Beyond the Roles", "icon": "☼", "desc": "Hidden Talents · Family", "intro": "Hidden Talents · Family", "questions": [{"q": "What do you enjoy doing outside of work?", "a": ["This is a hard one, because, fortunately, this job allows me to be flexible. But sometimes flexibility means I can always choose to pick up my computer and keep working. Over the past five years, one mission I have been pushing is self-care for students and for the group. I always think that as a leader, I need to practice what I preach. If I say, \"Oh, you go do it,\" and then I don't do it myself, that does not sound right to me. I always tell students that PhD and master's programs, taking the CRC exam and all of that, are a lot, so you need to make sure you have balance. I'm trying to make that effort myself.", "Outside of work, I really enjoy walking alone, especially when it's quiet in my neighborhood. There's something about the early morning, when it's not too sunny and not too hot. I like the breeze and the tranquility of walking on my own. At a certain time the school buses run by, and you can see families walking their kids to the bus stop. I enjoy seeing that, too, because you get to see the neighbors and say hi.", "My son is 13, and he is very involved in sports. I love watching him play soccer and basketball. I never played group sports when I was growing up, so I suppose this is one way I enjoy living vicariously through him. I get to learn all the rules, and it's about family, something I was never able to do that is now part of my life. I really enjoy that.", "Interviewer: Family seems to be a recurring theme.", "Yes, that's right. Good observation."]}, {"q": "Do you have any hidden talents or hobbies students might not know about?", "a": ["I gave that some thought, and I don't think I have any particular hidden talents. I can't go on America's Got Talent; no, I can't do that. But I used to play classical piano. I initiated it myself; I told my parents I wanted to learn piano when I was younger, and I played through college. I got close to completing the tenth level, but I did not finish. So maybe eventually, in retirement, I may pick it up again so I can finish that.", "Another thing is that I used to practice taekwondo. I started late, in graduate school, and I found it amazing for stress management. But I stopped after becoming a faculty member. So these aren't really talents, but they are things students may not know about me. I would love to pick these two hobbies back up, so that I can enjoy work and enjoy life, and get to play and recharge, so that I continue to have the energy to serve students and the profession, and to enjoy time with my family."]}, {"q": "How do you balance motherhood with your academic and leadership roles?", "a": ["I'm happy to answer that. I have had discussions with students about this before, so it's not something I would shy away from. It is hard. I would honestly say that for us as women, there is still an expectation of you as a woman and as a mother. People sometimes say, \"Well, you cannot have everything. If you want to be a good mother, you need to be a full-time mother. If you want to be good at your job, you need somebody else to drive your children to practice, to stay with them when they're sick.\"", "So yes, we cannot have it all. But who are we to define what a perfect mother is? Who are we to say we are perfect professors? There is no definition of perfect. To me, embracing the imperfection, and the ability to integrate both, is the perfect way of doing it.", "So I feel proud telling students, \"I'm sorry, I stayed up because my son was sick,\" or, when he was younger and had to stay home, \"I cannot meet today. Would you mind if we reschedule?\" I feel proud, and I also feel bad for not doing my job, quote-unquote. But it's also important for me to be a role model for women in any profession, and to show that this is the reality of life. If I had everything perfectly done, then you would miss the moments when you giggle with your kids, cheer at their soccer games, console them when they lose, and go get ice cream with them. You would miss all that.", "I love my job, and part of that is feeling that I can share the true human side of who I am. If you think a perfect faculty member cannot show emotions, cannot get sick, and has to attend to everything, I just don't think that is realistic in the real world. As long as you give your 400% when you attend to each aspect, people who understand will know, and they will give you grace. And if some people don't give you grace, that's okay. Life happens. Kids get sick, you can't meet, you miss an appointment, but we move on, because that's part of real life.", "I believe I did my best. Sometimes I miss certain things, but I'm proud to say I can still make it up and still do what I need to do. I would not trade it for being a perfect mother or a perfect faculty member. I like it the way I am.", "This has been great. It actually helps me reflect on my life and my work, and see some aspects I can improve. But it's all because of you. Again, without our students, we don't have a program and we don't have a job. So thank you to our two student representatives, and please pass this on to your fellow students: it is great to have you as part of this program."]}]}];
